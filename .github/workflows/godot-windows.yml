# The Godot port (apps/simulator-godot) on a GitHub-hosted Windows runner, which has no GPU.
# What it answers, in the job summaries and the uploaded artifacts (apps/simulator-godot/PORTING.md,
# "Release builds and Windows", explains the tooling in apps/simulator-godot/tools/ci):
#   checks  - the C# SimulationChecks against the Swift reference, default and with MARVIN_PORTABLE_MATH=1
#             (a numeric difference is a finding, a crash or failed check fails the job), on Windows, Linux and macOS;
#   libm    - which C library functions round differently from Darwin's, call by call (tools/checks --libm-probe);
#   assets  - the game's assets generated on Windows with the repository's exporters, against a Mac's;
#   game    - the generated town (--town-statistics against the macOS game, --town-reference-dump against Godot on
#             macOS), the deterministic logic modes headless against Godot on macOS and the macOS game, then the
#             Windows export (tools/export windows) and the exported exe headless (a crash, also one while quitting
#             after every report was written, fails the job), and diagnostics;
#   render  - Direct3D 12 (WARP) and Vulkan through Mesa's lavapipe, a few deterministic captures against
#             Godot-on-macOS captures (a driver that does not render is not a failure, a crash is).
# On demand (workflow_dispatch, exit_diagnostics): how the builds end, repeated runs and cdb with full page heap and SOS
# (tools/ci/exit-diagnostics.ps1), in the game and render jobs.
name: Godot port on Windows

on:
  workflow_dispatch:
    inputs:
      regenerate_assets:
        description: Generate the game's assets again instead of restoring them from the cache
        type: boolean
        default: false
      exit_diagnostics:
        description: How the builds end (tools/ci/exit-diagnostics.ps1) - repeated runs, cdb with full page heap and SOS
        type: boolean
        default: false
  push:
    branches: [codex/mos-aster-racing-city]
    paths:
      - apps/simulator-godot/**
      - apps/simulator-macos/Resources/**
      - scripts/prepare-simulator-assets.py
      - scripts/export-marvin-simulator.py
      - scripts/export-r2d2-simulator.py
      - scripts/export-racers-simulator.py
      - scripts/racer_gltf.py
      - hardware/mechanical/step/marvin_robot.step
      - .github/workflows/godot-windows.yml

permissions:
  contents: read

concurrency:
  group: godot-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.2'
  MESA_VERSION: '26.2.4'          # pal1000/mesa-dist-win, for lavapipe
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'

defaults:
  run:
    shell: bash

jobs:
  checks:
    # Windows is the question; Linux (glibc) and a macOS runner (Darwin libm, where the reference comes from) show
    # whether a difference is Windows' C runtime or any libm other than Darwin's.
    name: Core maths (SimulationChecks, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-checks-${{ runner.os }}-${{ hashFiles('apps/simulator-godot/src/**/*.csproj') }}
      - name: Build
        working-directory: apps/simulator-godot
        run: dotnet build src/Checks/MarvinChecks.csproj -c Release -nologo -v q
      - name: Run SimulationChecks (default, then MARVIN_PORTABLE_MATH=1)
        id: run
        working-directory: apps/simulator-godot
        run: |
          mkdir -p ../../out/checks
          set +e
          dotnet run --project src/Checks/MarvinChecks.csproj -c Release --no-build > ../../out/checks/checks-default.txt 2> ../../out/checks/checks-default.err
          echo "default=$?" >> "$GITHUB_OUTPUT"
          MARVIN_PORTABLE_MATH=1 dotnet run --project src/Checks/MarvinChecks.csproj -c Release --no-build > ../../out/checks/checks-portable.txt 2> ../../out/checks/checks-portable.err
          echo "portable=$?" >> "$GITHUB_OUTPUT"
          cat ../../out/checks/checks-default.err ../../out/checks/checks-portable.err
          exit 0
      - name: Compare with the Swift reference
        run: >-
          python apps/simulator-godot/tools/ci/checks-report.py
          --reference apps/simulator-godot/src/Checks/reference/simulation-checks-swift.txt
          --run "default|out/checks/checks-default.txt|${{ steps.run.outputs.default }}"
          --run "MARVIN_PORTABLE_MATH=1|out/checks/checks-portable.txt|${{ steps.run.outputs.portable }}"
          --out out/checks --title "Core maths on ${{ runner.os }} (${{ matrix.os }}): SimulationChecks against the Swift reference"
      - name: Portable maths against Darwin and NEON (macOS runner; tools/checks --portable-math)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        working-directory: apps/simulator-godot
        run: |
          # The software NEON rsqrt/recip that x64 uses, for all 2^32 floats, and 4 million hypot pairs against libSystem.
          dotnet run --project src/Checks/MarvinChecks.csproj -c Release --no-build -- --portable-math 4 | tee ../../out/checks/portable-math.txt
          {
            echo "## Portable maths on the macOS runner (arm64)"
            echo
            echo '```'
            cat ../../out/checks/portable-math.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: libm probe (the platform's sin, cos, atan2, exp, pow ... for the game's arguments)
        if: ${{ !cancelled() }}
        working-directory: apps/simulator-godot
        run: dotnet run --project src/Checks/MarvinChecks.csproj -c Release --no-build -- --libm-probe ../../out/libm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-${{ matrix.os }}
          path: out/checks
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: libm-${{ matrix.os }}
          path: out/libm
          retention-days: 7

  libm:
    name: Which libm functions differ from macOS
    needs: checks
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: libm-*
          path: probes
      - name: Compare Windows and Linux with macOS, call by call
        run: >-
          python3 apps/simulator-godot/tools/ci/libm-report.py --reference "macOS|probes/libm-macos-latest"
          --run "Windows|probes/libm-windows-latest" --run "Linux|probes/libm-ubuntu-latest" --out out/libm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libm-report
          path: out/libm
          retention-days: 14

  assets:
    name: Game assets (generated on Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache key (exporters, their LFS sources by object id, the macOS Resources, the sync script)
        id: key
        run: |
          key=$(git ls-files -s apps/simulator-macos/Resources hardware/mechanical/step/marvin_robot.step \
                scripts/prepare-simulator-assets.py scripts/export-marvin-simulator.py scripts/export-r2d2-simulator.py \
                scripts/export-racers-simulator.py scripts/racer_gltf.py apps/simulator-godot/tools/sync-assets.py \
                | sha256sum | cut -c1-20)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Restore the generated assets
        id: cache
        if: ${{ !inputs.regenerate_assets }}
        uses: actions/cache/restore@v4
        with:
          path: apps/simulator-godot/assets
          key: godot-assets-windows-${{ steps.key.outputs.key }}
      - name: Fetch the LFS sources (macOS Resources, Marvin's STEP master)
        if: steps.cache.outputs.cache-hit != 'true'
        run: git lfs pull --include="apps/simulator-macos/Resources/**,hardware/mechanical/step/marvin_robot.step"
      - name: Generate (scripts/prepare-simulator-assets.py, as build-app.sh does)
        if: steps.cache.outputs.cache-hit != 'true'
        run: python scripts/prepare-simulator-assets.py
      - name: Sync (apps/simulator-godot/tools/sync-assets.py)
        if: steps.cache.outputs.cache-hit != 'true'
        run: python apps/simulator-godot/tools/sync-assets.py
      - name: Save the generated assets
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: apps/simulator-godot/assets
          key: godot-assets-windows-${{ steps.key.outputs.key }}
      - name: Compare with a Mac's assets
        run: python apps/simulator-godot/tools/ci/assets-report.py --out out/assets
      - uses: actions/upload-artifact@v4
        with:
          name: godot-assets
          path: apps/simulator-godot/assets
          retention-days: 3
          compression-level: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assets-report
          path: out/assets
          retention-days: 14

  game:
    name: Town, headless modes, export
    needs: assets
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: godot-assets
          path: apps/simulator-godot/assets
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-godot-${{ runner.os }}-${{ hashFiles('apps/simulator-godot/**/*.csproj') }}
      - name: Restore Godot ${{ env.GODOT_VERSION }} .NET
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot
          key: godot-${{ env.GODOT_VERSION }}-mono-win64
      - name: Download Godot ${{ env.GODOT_VERSION }} .NET
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          temp=$(cygpath -u "$RUNNER_TEMP")
          curl -fsSL --retry 3 -o "$temp/godot.zip" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_win64.zip"
          7z x -y -o"$RUNNER_TEMP/godot" "$RUNNER_TEMP/godot.zip" > /dev/null
          rm "$temp/godot.zip"
      - name: Locate Godot
        run: |
          exe=$(cygpath -m "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_mono_win64/Godot_v${GODOT_VERSION}-stable_mono_win64_console.exe")
          echo "GODOT=$exe" >> "$GITHUB_ENV"
          "$exe" --headless --version
      - name: Build the C# (tools/build)
        run: apps/simulator-godot/tools/build
      - name: Import (textures, audio)
        id: import
        run: |
          mkdir -p out
          start=$SECONDS
          "$GODOT" --headless --path apps/simulator-godot --import > out/import.log 2>&1 || { tail -50 out/import.log; exit 1; }
          echo "import took $((SECONDS - start)) s"
      - name: Headless modes (editor runtime) against Godot on macOS and the macOS game
        run: python apps/simulator-godot/tools/ci/headless-modes.py --godot "$GODOT" --out out/headless
      # The export runs even when a headless mode failed (the job still fails at the end).
      - name: Restore the Windows export templates
        id: templates-cache
        if: ${{ !cancelled() && steps.import.outcome == 'success' }}
        uses: actions/cache@v4
        with:
          path: ~/AppData/Roaming/Godot/export_templates/${{ env.GODOT_VERSION }}.stable.mono
          key: godot-templates-${{ env.GODOT_VERSION }}-mono-windows-x86_64
      - name: Download the export templates (Windows x86_64 only)
        if: ${{ !cancelled() && steps.import.outcome == 'success' && steps.templates-cache.outputs.cache-hit != 'true' }}
        run: |
          temp=$(cygpath -u "$RUNNER_TEMP")
          curl -fsSL --retry 3 -o "$temp/templates.tpz" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          dest="$APPDATA/Godot/export_templates/${GODOT_VERSION}.stable.mono"
          mkdir -p "$(cygpath -u "$dest")"
          7z e -y -o"$dest" "$RUNNER_TEMP/templates.tpz" templates/version.txt templates/icudt_godot.dat \
            templates/windows_release_x86_64.exe templates/windows_release_x86_64_console.exe \
            templates/windows_debug_x86_64.exe templates/windows_debug_x86_64_console.exe > /dev/null
          rm "$temp/templates.tpz"
          ls -la "$(cygpath -u "$dest")"
      - name: Export the Windows build (tools/export windows)
        id: export
        if: ${{ !cancelled() && steps.import.outcome == 'success' }}
        run: apps/simulator-godot/tools/export windows --zip
      - name: The exported exe, headless
        if: ${{ !cancelled() && steps.export.outcome == 'success' }}
        run: >-
          python apps/simulator-godot/tools/ci/headless-modes.py
          --exe apps/simulator-godot/build/windows/MarvinSimulator.console.exe --out out/export
          --only town-statistics,town-reference-dump,storm-race-test
          --title "Exported Windows build (MarvinSimulator.console.exe), headless"
      - name: Diagnostics (exit status of the exported build, town mesh welding)
        if: ${{ !cancelled() && steps.export.outcome == 'success' }}
        continue-on-error: true
        run: |
          mkdir -p out/diagnostics
          ci=apps/simulator-godot/tools/ci
          # The exported (release) build, verbose: what it does last before its exit status.
          python $ci/headless-modes.py --exe apps/simulator-godot/build/windows/MarvinSimulator.console.exe \
            --engine-args=--verbose --out out/diagnostics/export-verbose --only town-statistics,audio-facade-test \
            --title "Diagnostics: exported release build, --verbose" || true
          tail -60 out/diagnostics/export-verbose/town-statistics.log
          # The same project exported with the debug template.
          mkdir -p apps/simulator-godot/build/windows-debug
          "$GODOT" --headless --path apps/simulator-godot --export-debug "Windows Desktop" \
            "$(cygpath -m "$PWD/apps/simulator-godot/build/windows-debug/MarvinSimulator.exe")" > out/diagnostics/export-debug.log 2>&1 \
            || tail -30 out/diagnostics/export-debug.log
          python $ci/headless-modes.py --exe apps/simulator-godot/build/windows-debug/MarvinSimulator.console.exe \
            --out out/diagnostics/export-debug --only town-statistics,audio-facade-test \
            --title "Diagnostics: exported debug build" || true
          # Vertex welding of the town's street mesh (merged vertex counts differ from macOS): every raw vertex's bits
          # and its merged index, to diff with the same dump on a Mac.
          MARVIN_MESH_COUNTS=19238,13367 "$GODOT" --headless --path apps/simulator-godot -- --town-mesh-dump \
            "$(cygpath -m "$PWD/out/diagnostics/mesh")" --mesh-reuse-test > out/diagnostics/mesh.log 2>&1 || true
          grep "^pair" out/diagnostics/mesh/town-mesh.txt | head -5 || true
      - name: Exit diagnostics (on demand; repeated runs, cdb with full page heap)
        if: ${{ !cancelled() && inputs.exit_diagnostics && steps.export.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 60
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-sos | Out-String
          dotnet-sos install --architecture x64 | Out-String
          $debug = if (Test-Path apps/simulator-godot/build/windows-debug/MarvinSimulator.exe) { (Resolve-Path apps/simulator-godot/build/windows-debug/MarvinSimulator.exe).Path } else { '' }
          & apps/simulator-godot/tools/ci/exit-diagnostics.ps1 -Out out/exit-diagnostics -Runs 3 `
            -ReleaseExe (Resolve-Path apps/simulator-godot/build/windows/MarvinSimulator.exe).Path -DebugExe $debug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-reports
          path: |
            out
            apps/simulator-godot/build/*.log
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.export.outcome == 'success' }}
        with:
          name: MarvinSimulator-windows-x86_64
          path: apps/simulator-godot/build/windows
          retention-days: 7

  render:
    name: Rendering without a GPU (best effort)
    needs: assets
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: godot-assets
          path: apps/simulator-godot/assets
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q pillow
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-godot-${{ runner.os }}-${{ hashFiles('apps/simulator-godot/**/*.csproj') }}
      - name: Restore Godot ${{ env.GODOT_VERSION }} .NET
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot
          key: godot-${{ env.GODOT_VERSION }}-mono-win64
      - name: Download Godot ${{ env.GODOT_VERSION }} .NET
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          temp=$(cygpath -u "$RUNNER_TEMP")
          curl -fsSL --retry 3 -o "$temp/godot.zip" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_win64.zip"
          7z x -y -o"$RUNNER_TEMP/godot" "$RUNNER_TEMP/godot.zip" > /dev/null
          rm "$temp/godot.zip"
      - name: Locate Godot
        run: |
          exe=$(cygpath -m "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_mono_win64/Godot_v${GODOT_VERSION}-stable_mono_win64_console.exe")
          echo "GODOT=$exe" >> "$GITHUB_ENV"
      - name: Build the C# (tools/build)
        run: apps/simulator-godot/tools/build
      - name: Import (textures, audio)
        run: |
          mkdir -p out
          "$GODOT" --headless --path apps/simulator-godot --import > out/import.log 2>&1 || { tail -50 out/import.log; exit 1; }
      - name: What the runner has (display adapters, Vulkan)
        continue-on-error: true
        shell: pwsh
        run: |
          Get-CimInstance Win32_VideoController | Format-Table Name, DriverVersion, AdapterRAM -AutoSize | Out-String -Width 200
          Get-ChildItem C:\Windows\System32\vulkan-1.dll, C:\Windows\System32\D3D12.dll, C:\Windows\System32\d3d10warp.dll -ErrorAction SilentlyContinue | Format-Table Name, Length, LastWriteTime
      - name: Screen 1920 x 1080 (the game's 1280 x 820 window does not fit the runner's 1024 x 768)
        continue-on-error: true
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @"
          using System; using System.Runtime.InteropServices;
          public static class Screen1080 {
            [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Ansi)] public struct DEVMODE {
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;
              public short dmSpecVersion, dmDriverVersion, dmSize, dmDriverExtra; public int dmFields;
              public int dmPositionX, dmPositionY, dmDisplayOrientation, dmDisplayFixedOutput;
              public short dmColor, dmDuplex, dmYResolution, dmTTOption, dmCollate;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;
              public short dmLogPixels; public int dmBitsPerPel, dmPelsWidth, dmPelsHeight, dmDisplayFlags, dmDisplayFrequency;
              public int dmICMMethod, dmICMIntent, dmMediaType, dmDitherType, dmReserved1, dmReserved2, dmPanningWidth, dmPanningHeight; }
            [DllImport("user32.dll", CharSet = CharSet.Ansi)] static extern bool EnumDisplaySettings(string name, int mode, ref DEVMODE dm);
            [DllImport("user32.dll", CharSet = CharSet.Ansi)] static extern int ChangeDisplaySettings(ref DEVMODE dm, int flags);
            public static string Set(int w, int h) {
              var dm = new DEVMODE(); dm.dmSize = (short)Marshal.SizeOf(typeof(DEVMODE));
              EnumDisplaySettings(null, -1, ref dm);
              string before = dm.dmPelsWidth + "x" + dm.dmPelsHeight;
              dm.dmPelsWidth = w; dm.dmPelsHeight = h; dm.dmFields = 0x80000 | 0x100000;
              return before + " -> ChangeDisplaySettings " + ChangeDisplaySettings(ref dm, 0); } }
          "@
          [Screen1080]::Set(1920, 1080)
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
      # A driver that does not render is not a failure; a crash (also while quitting) is.
      - name: Direct3D 12 (WARP software adapter, if Godot takes it)
        run: python apps/simulator-godot/tools/ci/render-captures.py --godot "$GODOT" --driver d3d12 --label "Direct3D 12" --out out/render
      - name: Exit diagnostics (on demand; the editor runtime's town smoke on Direct3D 12 under cdb)
        if: ${{ !cancelled() && inputs.exit_diagnostics }}
        continue-on-error: true
        timeout-minutes: 45
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-sos | Out-String
          dotnet-sos install --architecture x64 | Out-String
          $gui = $env:GODOT -replace '_console\.exe$', '.exe'
          & apps/simulator-godot/tools/ci/exit-diagnostics.ps1 -Out out/exit-diagnostics -Godot $gui `
            -Project (Resolve-Path apps/simulator-godot).Path -Rendered d3d12
      - name: Mesa lavapipe (software Vulkan) and the Vulkan loader
        id: lavapipe
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          temp=$(cygpath -u "$RUNNER_TEMP")
          curl -fsSL --retry 3 -o "$temp/mesa.7z" \
            "https://github.com/pal1000/mesa-dist-win/releases/download/${MESA_VERSION}/mesa3d-${MESA_VERSION}-release-msvc.7z"
          7z x -y -o"$RUNNER_TEMP/mesa" "$RUNNER_TEMP/mesa.7z" > /dev/null
          icd=$(cygpath -w "$(ls "$temp"/mesa/x64/lvp_icd.x86_64.json)")
          # The Vulkan loader ignores VK_DRIVER_FILES in an elevated process (the runner's): register the driver.
          MSYS_NO_PATHCONV=1 reg add 'HKLM\SOFTWARE\Khronos\Vulkan\Drivers' /v "$icd" /t REG_DWORD /d 0 /f
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_LOADER_DEBUG=error,warn,driver" >> "$GITHUB_ENV"
          # The Vulkan loader (vulkan-1.dll) comes with GPU drivers, which the runner lacks: take LunarG's runtime.
          if [ ! -f /c/Windows/System32/vulkan-1.dll ]; then
            curl -fsSL --retry 3 -o "$temp/vkrt.zip" https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-runtime-components.zip
            7z x -y -o"$RUNNER_TEMP/vkrt" "$RUNNER_TEMP/vkrt.zip" > /dev/null
            loader=$(find "$temp/vkrt" -path '*x64*' -name vulkan-1.dll | head -n 1)
            echo "loader: $loader"
            cp "$loader" "$(dirname "$(cygpath -u "$GODOT")")/"
          fi
      - name: Vulkan through lavapipe
        if: ${{ !cancelled() && steps.lavapipe.outcome == 'success' }}
        # The town smoke takes about 20 minutes on lavapipe (2.5 on WARP): the facade and HUD modes only.
        run: >-
          python apps/simulator-godot/tools/ci/render-captures.py --godot "$GODOT" --driver vulkan
          --label "Vulkan (Mesa lavapipe)" --out out/render --only facade-test,hud-smoke-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render
          path: out
          retention-days: 14

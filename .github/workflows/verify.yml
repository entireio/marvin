name: Verify Marvin
on: [push, pull_request]
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: marvin_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: marvin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U marvin_test" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgresql://marvin_test:ci-test-only@127.0.0.1:5432/marvin_test
      - run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ./work/browsers
      - run: npm run test:e2e
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            work/screenshots
            work/playwright-report
            work/playwright-results
  firmware:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.4.2
    steps:
      - uses: actions/checkout@v4
      - name: Compile ESP32-S3 WROOM baseline
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py -C firmware build
      - uses: actions/upload-artifact@v4
        with:
          name: esp32s3-bench-firmware
          path: |
            firmware/build/marvin.bin
            firmware/build/marvin.elf
            firmware/build/marvin.map

; Marvin firmware — PlatformIO project configuration
;
; Two targets, one source tree. The pin map for each lives in src/boards/, and
; the environment below picks one with a MARVIN_BOARD_* flag — no driver code
; is board-aware. Earlier prototypes ran on ESP32-C6 boards
; (esp32-c6-devkitm-1, nanoESP32-C6-v1711); those environments are not
; currently maintained.
;
;   esp32c3-supermini   drive, head, BLE, and voice without the wake word
;   esp32s3-supermini   the same, and the wake word when there is one
;
; Both boards do voice. What the C3 cannot do is listen for its own name: it has
; no PSRAM and no vector unit, so there is nowhere to run a keyword model, and
; conversations are started from the web controller instead. The S3 is where
; "Hey Marvin" will land, along with the echo cancellation that allows talking
; over a reply — both need the PSRAM.
;
; Nothing else differs. The same drivers, the same protocol, the same backend.

[env]
; The pioarduino fork of platform-espressif32, not the platformio.org one.
;
; This is not a preference. The official platform is still shipping Arduino
; 2.0.17 on ESP-IDF 4.4, whose only I2S driver is the deprecated one, and which
; has no route to the speech components at all. pioarduino tracks Espressif's
; own Arduino 3.x releases on IDF 5.x, which brings three things this project
; needs: the i2s_std full-duplex driver, esp-sr (wake word and, later, the
; acoustic echo cancellation that barge-in depends on), and esp-tflite-micro.
;
; Pinned to an exact release. The Arduino API surface we use is unchanged, so
; the drive and head code compiles across the move untouched.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_deps =
	madhephaestus/ESP32Servo@^3.0.5
	h2zero/NimBLE-Arduino@^2.1.0

[env:esp32c3-supermini]
; The `lolin_c3_mini` board definition is used because the SuperMini has no
; upstream definition of its own; the two are pin- and flash-compatible for
; our purposes.
board = lolin_c3_mini
; Wi-Fi, TLS, Bluetooth and the WebSocket client together outgrow the 1.25 MB
; the default two-slot layout allows — the same reason as on the S3, reached
; sooner because the C3's flash is smaller. One 3 MB slot, and no OTA.
board_build.partitions = huge_app.csv
lib_deps =
	${env.lib_deps}
	links2004/WebSockets@^2.7.3
	bblanchon/ArduinoJson@^7.4.2
build_flags =
	-DMARVIN_BOARD_ESP32C3_SUPERMINI
	-DMARVIN_VOICE

[env:esp32s3-supermini]
; Likewise no upstream definition: `esp32-s3-devkitc-1` is the generic S3 board,
; narrowed here to the SuperMini's ESP32-S3FH4R2 module — 4 MB flash with 2 MB
; of *quad* PSRAM in package, which is what `qio_qspi` selects. Getting that
; wrong gives a board that boots and then finds no PSRAM.
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.arduino.memory_type = qio_qspi
; Wi-Fi, BLE, TLS and the wake word model together outgrow the 1.25 MB that the
; default two-slot layout allows. This is one 3 MB slot instead, which means no
; over-the-air update — a trade worth revisiting when OTA is on the table.
board_build.partitions = huge_app.csv
lib_deps =
	${env.lib_deps}
	links2004/WebSockets@^2.7.3
	bblanchon/ArduinoJson@^7.4.2
build_flags =
	-DMARVIN_BOARD_ESP32S3_SUPERMINI
	-DMARVIN_VOICE
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

; Marvin firmware — PlatformIO project configuration
;
; Current target: ESP32-C3 SuperMini.
; The `lolin_c3_mini` board definition is used because the SuperMini has no
; upstream definition of its own; the two are pin- and flash-compatible for
; our purposes.
;
; The pin map for this board lives in src/config.h. Supporting another ESP32
; variant means adding an [env:...] block here plus a matching pin section
; there — no driver changes. Earlier prototypes ran on ESP32-C6 boards
; (esp32-c6-devkitm-1, nanoESP32-C6-v1711); those environments are not
; currently maintained.

[env:esp32-super-mini]
platform = espressif32
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
lib_deps =
	madhephaestus/ESP32Servo@^3.0.5
	h2zero/NimBLE-Arduino@^2.1.0
